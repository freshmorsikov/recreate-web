name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set site URL
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER}"

          if [[ "${repo_name,,}" == "${owner,,}.github.io" ]]; then
            base_path=""
          else
            base_path="/${repo_name}"
          fi

          {
            echo "GITHUB_PAGES=true"
            echo "NEXT_PUBLIC_BASE_PATH=${base_path}"
            echo "NEXT_PUBLIC_SITE_URL=https://${owner}.github.io${base_path}"
          } >> "${GITHUB_ENV}"

      - name: Build static site
        run: npm run build

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          asset_prefix="${NEXT_PUBLIC_BASE_PATH#/}"

          if [[ -n "${asset_prefix}" && -d "dist/client/${asset_prefix}/_next" ]]; then
            rm -rf dist/client/_next
            mv "dist/client/${asset_prefix}/_next" dist/client/_next
            rm -rf "dist/client/${asset_prefix}"
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          include-hidden-files: true
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
